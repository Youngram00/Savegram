name: VexGram Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check Telegram source
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Check project structure
        run: |
          echo "Checking VexGram source..."
          ls -la
          echo "Searching for Gradle project files..."
          find . -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "gradlew" \) -print
